<style>
:root{--bg:#f6f9ff;--surface:#fff;--text:#0f172a;--text-soft:#334155;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb;--blue-dark:#1d4ed8;--blue-soft:#eff6ff;--cyan:#06b6d4;--ok:#059669;--bad:#dc2626;--warn:#d97706;--r:14px;--sh:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.04)}

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .5rem;line-height:1.25}h1{font-size:clamp(1.5rem,3vw,2.2rem)}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin:0 0 1rem;color:var(--text-soft)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
[data-theme="dark"] .topbar{background:rgba(18,27,46,.94)}
.nav{display:flex;align-items:center;gap:1rem;padding:.6rem clamp(.9rem,2vw,1.75rem);max-width:1440px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;color:var(--text);font-size:.98rem}
.brand svg{height:28px;width:auto}
.nav-links{display:flex;gap:.12rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav-link{padding:.38rem .7rem;border-radius:999px;color:var(--text-soft);font-size:.82rem;font-weight:600}
.nav-link:hover{background:var(--blue-soft);color:var(--blue-dark);text-decoration:none}
.nav-link.active{background:var(--blue);color:#fff}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:.3rem .5rem;cursor:pointer;color:var(--text);font-size:.92rem}
.layout{display:flex;flex:1;max-width:1440px;width:100%;margin:0 auto}
.sidebar{width:210px;flex:0 0 210px;padding:.9rem .7rem;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto}
.sb-group{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:.9rem .4rem .3rem}
.sb-link{display:flex;align-items:center;gap:.5rem;padding:.42rem .55rem;border-radius:8px;color:var(--text-soft);font-size:.83rem;font-weight:600}
.sb-link:hover{background:var(--blue-soft);color:var(--blue-dark);text-decoration:none}
.sb-link.active{background:var(--blue);color:#fff}
.main{flex:1;padding:1.4rem clamp(.9rem,2.2vw,1.9rem);min-width:0}
.main.full{padding:0}
.footer{border-top:1px solid var(--border);padding:.8rem clamp(.9rem,2vw,1.75rem);font-size:.74rem;color:var(--muted);text-align:center;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;box-shadow:var(--sh)}
.card.pad-lg{padding:1.5rem}
.card-title{display:flex;align-items:center;gap:.4rem;margin-bottom:.75rem;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;gap:.85rem}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.stack{display:flex;flex-direction:column;gap:.7rem}
.row{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.5rem .95rem;border-radius:9px;border:1px solid transparent;font-weight:650;font-size:.84rem;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.22)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-soft)}
.btn-ghost:hover{background:var(--blue-soft);color:var(--blue-dark)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:.28rem .6rem;font-size:.74rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stat{display:flex;flex-direction:column;gap:.08rem}
.stat-value{font-size:1.65rem;font-weight:800;color:var(--blue-dark)}
.stat-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:.22rem;padding:.14rem .5rem;border-radius:999px;font-size:.66rem;font-weight:800}
.badge-pyq{background:#fef3c7;color:#b45309}.badge-ai{background:#ede9fe;color:#6d28d9}.badge-curated{background:#dcfce7;color:#15803d}.badge-type{background:var(--blue-soft);color:var(--blue-dark)}
.badge-diff-easy{background:#dcfce7;color:#15803d}.badge-diff-medium{background:#fef3c7;color:#b45309}.badge-diff-hard{background:#fee2e2;color:#b91c1c}
.field{display:flex;flex-direction:column;gap:.22rem;font-size:.78rem;font-weight:700;color:var(--text-soft)}
.input,.select{width:100%;padding:.5rem .7rem;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem;font-family:inherit}

.hero{background:linear-gradient(135deg,#1d4ed8,#0891b2);color:#fff;border-radius:var(--r);padding:clamp(1.4rem,4vw,2.5rem);margin-bottom:1.2rem;position:relative;overflow:hidden}
.hero h1{color:#fff;margin-bottom:.6rem}.hero p{color:rgba(255,255,255,.92);max-width:620px;font-size:.96rem}.hero .row{margin-top:1.1rem;gap:.55rem}
.hero .btn-ghost{border-color:rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.1)}
.tree-subject{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:.7rem;overflow:hidden}
.tree-subject-head{padding:.75rem .85rem;cursor:pointer;display:flex;align-items:center;gap:.5rem;font-weight:700;border-bottom:1px solid var(--border)}
.tree-subject-head:hover{background:var(--blue-soft)}
.tree-subject-count{font-size:.7rem;font-weight:700;color:var(--muted);margin-left:auto;background:var(--bg);padding:.1rem .45rem;border-radius:999px}
.tree-units{display:none;padding:.4rem .6rem}.tree-units.open{display:block}
.tree-unit{margin:.28rem 0}
.tree-unit-head{padding:.42rem .55rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:.86rem;border-radius:6px}

.qcard-head{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.55rem}
.qcard-text{font-weight:600;margin-bottom:.7rem;color:var(--text);line-height:1.55}
.qoptions{display:grid;gap:.4rem}
.qoption{display:flex;gap:.55rem;align-items:flex-start;padding:.5rem .7rem;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:var(--surface)}
.qoption:hover{border-color:var(--blue);background:var(--blue-soft)}
.qoption.selected{border-color:var(--blue);background:var(--blue-soft);font-weight:600}
.qoption.correct{border-color:var(--ok);background:#ecfdf5}.qoption.wrong{border-color:var(--bad);background:#fef2f2}

.exam-shell{display:grid;grid-template-columns:1fr 265px;gap:.85rem;padding:.85rem;min-height:calc(100vh - 100px)}
.exam-header{grid-column:1/-1;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;padding:.65rem .85rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.exam-timer{font-family:ui-monospace,monospace;font-size:.98rem;font-weight:700;padding:.28rem .65rem;border-radius:7px;background:var(--blue-soft);color:var(--blue-dark)}
.exam-timer.danger{background:#fee2e2;color:#b91c1c}

.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.28rem;margin:.6rem 0}
.palette-btn{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-weight:700;font-size:.75rem;cursor:pointer;color:var(--text-soft)}
.palette-btn:hover{border-color:var(--blue)}
.palette-btn.answered{background:#dcfce7;color:#15803d;border-color:#86efac}
.palette-btn.marked{background:#fef3c7;color:#b45309;border-color:#fcd34d}
.palette-btn.current{outline:2px solid var(--blue);outline-offset:1px}
.result-card{border:1px solid var(--border);border-radius:var(--r);padding:.85rem;background:var(--surface);display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;cursor:pointer;margin-bottom:.55rem}
.result-card:hover{border-color:var(--blue)}
.result-score{font-size:1.4rem;font-weight:800;color:var(--blue-dark);min-width:55px}
.result-meta{flex:1;min-width:180px}.result-meta strong{display:block;color:var(--text);margin-bottom:.08rem}.result-meta span{font-size:.78rem;color:var(--muted)}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:.28rem}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:4px;transition:width .3s}
.toast-container{position:fixed;right:.7rem;bottom:.7rem;z-index:200;display:flex;flex-direction:column;gap:.4rem;max-width:320px}
.toast{padding:.65rem .85rem;border-radius:9px;background:var(--surface);border-left:4px solid var(--blue);box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:.81rem;color:var(--text)}
.toast-error{border-left-color:var(--bad)}.toast-success{border-left-color:var(--ok)}.toast-warn{border-left-color:var(--warn)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:150;padding:1rem}
.modal{background:var(--surface);border-radius:var(--r);padding:1.25rem;max-width:460px;width:100%}
.empty{padding:2rem .9rem;text-align:center;color:var(--muted);font-size:.85rem}
.empty-icon{font-size:2rem;margin-bottom:.35rem;opacity:.5}
.divider{height:1px;background:var(--border);margin:.8rem 0}
.callout{padding:.7rem .85rem;border-radius:9px;font-size:.81rem;line-height:1.5}
.callout-warn{background:#fef3c7;border-left:4px solid var(--warn);color:#78350f}
.callout-info{background:var(--blue-soft);border-left:4px solid var(--blue);color:var(--text-soft)}
.callout-error{background:#fee2e2;border-left:4px solid var(--bad);color:#7f1d1d}
.menu-toggle{display:none;background:transparent;border:1px solid var(--border);border-radius:8px;padding:.3rem .45rem;cursor:pointer;color:var(--text);font-size:1rem}
@media (max-width:900px){.sidebar{position:fixed;left:0;top:50px;bottom:0;z-index:50;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.menu-toggle{display:inline-flex}.main{padding:.85rem}.exam-shell{grid-template-columns:1fr}.exam-palette{position:static}.palette-grid{grid-template-columns:repeat(8,1fr)}}
@media (max-width:600px){.nav-links{display:none}.hero{padding:1.25rem}.grid-4{grid-template-columns:repeat(2,1fr)}.palette-grid{grid-template-columns:repeat(6,1fr)}}
</style>

    out.push(qa('el1_'+i,'Chemistry','Elements','Symbols','easy',`Symbol ${sym} is:`,opts,opts.indexOf(name),`${sym} = ${name}.`));
  });
  ELEMENTS.forEach(([sym,name,z],i)=>{
    const others=shuffle(ELEMENTS.filter((_,j)=>j!==i)).slice(0,3).map(e=>e[1]);
    const opts=shuffle([name,...others]);
    out.push(qa('el2_'+i,'Chemistry','Elements','Atomic Numbers','easy',`Atomic number ${z}:`,opts,opts.indexOf(name),`${name} Z=${z}.`));
  });
  // Formulas (44)
  FORMULAS.forEach(([name,correct,...opts],i)=>{
    const arr=shuffle([correct,...opts]);
    out.push(qa('fm_'+i,'Physics','Formula Recall','Formulas','easy',`${name.trim()} = ?`,arr,arr.indexOf(correct),`${name.trim()} = ${correct}.`));
  });
  // SI Units (25)
  SI_UNITS.forEach(([qty,unit],i)=>{
    const all=SI_UNITS.map(x=>x[1]).filter(u=>u!==unit);
    const opts=shuffle([unit,...shuffle(all).slice(0,3)]);
    out.push(qa('si_'+i,'Physics','SI Units','Units','easy',`SI unit of ${qty}?`,opts,opts.indexOf(unit),`${unit}.`));
  });
  // Constants (20)
  CONSTANTS.forEach(([name,val,...opts],i)=>{
    const arr=shuffle([val,...opts]);
    out.push(qa('co_'+i,'Physics','Constants','Physical Constants','easy',`${name} = ?`,arr,arr.indexOf(val),`${val}.`));
  });
  // Bio facts (44)
  BIO_FACTS.forEach(([name,fact],i)=>{
    const all=BIO_FACTS.map(x=>x[1]).filter(f=>f!==fact);
    const opts=shuffle([fact,...shuffle(all).slice(0,3)]);
    out.push(qa('bf_'+i,'Biology','Biology Facts',name.trim().slice(0,30),'easy',`${name}:`,opts,opts.indexOf(fact),`${fact}.`));
  });
  // Chem facts (31)
  CHEM_FACTS.forEach(([qst,fact],i)=>{
    const all=CHEM_FACTS.map(x=>x[1]).filter(f=>f!==fact);
    const opts=shuffle([fact,...shuffle(all).slice(0,3)]);
    out.push(qa('cf_'+i,'Chemistry','Chemistry Facts','General','medium',`${qst}:`,opts,opts.indexOf(fact),`${fact}.`));
  });
  // Physics facts (48)
  PHYS_FACTS.forEach(([qst,fact],i)=>{
    const all=PHYS_FACTS.map(x=>x[1]).filter(f=>f!==fact);
    const opts=shuffle([fact,...shuffle(all).slice(0,3)]);
    out.push(qa('pf_'+i,'Physics','Physics Facts','General','easy',`${qst}:`,opts,opts.indexOf(fact),`${fact}.`));
  });
  // Numerical: force
  [[5,2],[10,3],[20,4],[2,5],[8,2],[15,3],[25,4],[30,5],[12,2],[6,3],[4,8],[50,2],[3,6],[18,4],[9,3]].forEach(([m,a],i)=>{
    const ans=m*a;const opts=shuffle([`${ans} N`,`${ans+5} N`,`${ans-3} N`,`${ans+10} N`]);
    out.push(qa('nf_'+i,'Physics','Laws of Motion','Numerical','easy',`m=${m} kg, a=${a} m/s². F?`,opts,opts.indexOf(`${ans} N`),`F=ma=${ans} N.`));
  });
  // Numerical: pH
  [['0.1',1],['0.01',2],['0.001',3],['0.0001',4],['1',0],['0.00001',5],['0.05',1.3],['0.005',2.3],['0.0005',3.3],['0.00005',4.3]].forEach(([c,ph],i)=>{
    const opts=shuffle([`${ph}`,`${ph+1}`,`${ph+7}`,`${Math.max(0,ph-1)}`]);
    out.push(qa('np_'+i,'Chemistry','Equilibrium','pH','medium',`pH of ${c} M HCl:`,opts,opts.indexOf(`${ph}`),`pH=${ph}.`));
  });
  // Numerical: moles
  [['12g C','1'],['24g C','2'],['18g H2O','1'],['36g H2O','2'],['44g CO2','1'],['88g CO2','2'],['32g O2','1'],['64g O2','2'],['58.5g NaCl','1'],['117g NaCl','2']].forEach(([s,ans],i)=>{
    const opts=shuffle(['1 mole','2 moles','0.5 mole',`${ans} mole${ans==='1'?'':'s'}`]);
    out.push(qa('nm_'+i,'Chemistry','Some Basic Concepts','Mole Concept','easy',`Moles in ${s}?`,opts,opts.indexOf(`${ans} mole${ans==='1'?'':'s'}`),`${ans} mole.`));
  });
  // Genetics crosses
  [['Aa × Aa','1:2:1'],['AA × aa','all Aa'],['Aa × aa','1:1'],['AA × Aa','1:1'],['aa × aa','all aa']].forEach(([c,r],i)=>{
    const all=['1:2:1','all Aa','1:1','all aa'];const opts=shuffle([r,...all.filter(x=>x!==r).slice(0,3)]);
    out.push(qa('ng_'+i,'Biology','Genetics','Mendelian','medium',`${c} ratio:`,opts,opts.indexOf(r),`${r}.`));
  });
  return out;
}

function answerPractice(el,chosen,correct){

function ExamPage(){

  const html=`<div class="exam-shell"><div class="exam-header"><div class="exam-timer" id="exam-timer">--:--</div><div style="flex:1"><strong>${esc(State.exam.title)}</strong><div style="font-size:.74rem;color:var(--muted)">${State.exam.questions.length} Qs • +4 / −1</div></div><button class="btn btn-danger btn-sm" onclick="confirmSubmit()">Submit</button></div><div class="exam-main" id="exam-main"></div><aside class="exam-palette"><div class="card-title">Palette</div><div class="palette-grid" id="exam-palette"></div></aside></div>`;
  return {shell:p=>shell(p,html),mounted:()=>{startExamClock();renderExam();}};

function startExamClock(){
  clearInterval(State.examTimer);
  const upd=()=>{const el=document.getElementById('exam-timer');if(!el||!State.exam)return;const left=State.exam.endsAt-Date.now();if(left<=0){clearInterval(State.examTimer);toast('Time up!','warn');setTimeout(()=>{if(State.exam)finalizeExam();},400);return;}el.textContent=fmtTime(left);el.classList.toggle('danger',left<60000);};
  upd();State.examTimer=setInterval(upd,500);
}
function renderExam(){
  const ex=State.exam;if(!ex)return;const i=ex.currentIndex;const qq=ex.questions[i];const main=document.getElementById('exam-main');if(!main)return;const sel=ex.answers[i];
  main.innerHTML=`<div class="qcard-head"><span class="badge badge-type">Q ${i+1} / ${ex.questions.length}</span><span class="badge badge-type">${esc(qq.subject)}</span>${ex.marked[i]?'<span class="badge badge-diff-medium">★ Marked</span>':''}</div><div class="qcard-text">${esc(qq.question)}</div><div class="qoptions">${qq.options.map((o,j)=>`<div class="qoption ${sel===j?'selected':''}" onclick="examSelect(${j})"><span class="qoption-key">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></div>`).join('')}</div><div class="row" style="margin-top:.85rem;justify-content:space-between"><div class="row"><button class="btn btn-ghost btn-sm" onclick="examPrev()" ${i===0?'disabled':''}>← Prev</button><button class="btn btn-ghost btn-sm" onclick="examClear()">Clear</button><button class="btn btn-ghost btn-sm" onclick="examToggleMark()">${ex.marked[i]?'★':'☆'} Mark</button></div><button class="btn btn-primary btn-sm" onclick="examNext()" ${i===ex.questions.length-1?'disabled':''}>Next →</button></div>`;
  renderPalette();
}
function renderPalette(){
  const ex=State.exam;const g=document.getElementById('exam-palette');if(!g||!ex)return;
  g.innerHTML=ex.questions.map((_,i)=>{const c=['palette-btn'];if(ex.answers[i]!==null)c.push('answered');if(ex.marked[i])c.push('marked');if(i===ex.currentIndex)c.push('current');return `<button class="${c.join(' ')}" onclick="examJump(${i})">${i+1}</button>`;}).join('');
}
function examSelect(j){State.exam.answers[State.exam.currentIndex]=j;renderExam();}
function examClear(){State.exam.answers[State.exam.currentIndex]=null;renderExam();}
function examToggleMark(){State.exam.marked[State.exam.currentIndex]=!State.exam.marked[State.exam.currentIndex];renderExam();}
function examNext(){if(State.exam.currentIndex<State.exam.questions.length-1){State.exam.currentIndex++;renderExam();}}
function examPrev(){if(State.exam.currentIndex>0){State.exam.currentIndex--;renderExam();}}
function examJump(i){State.exam.currentIndex=i;renderExam();}
async function confirmSubmit(){if(await confirmDialog('Submit test?'))finalizeExam();}
function finalizeExam(){
  clearInterval(State.examTimer);
  const ex=State.exam;if(!ex)return;
  let correct=0,incorrect=0,unattempted=0,score=0;
  const subjStats={},topicStats={},review=[];
  ex.questions.forEach((qq,i)=>{
    const sel=ex.answers[i];const ok=sel===qq.correctAnswer;
    if(sel===null)unattempted++;else if(ok){correct++;score+=4;}else{incorrect++;score-=1;}
    subjStats[qq.subject]??={total:0,correct:0};subjStats[qq.subject].total++;if(ok)subjStats[qq.subject].correct++;
    topicStats[qq.topic]??={subject:qq.subject,total:0,correct:0};topicStats[qq.topic].total++;if(ok)topicStats[qq.topic].correct++;
    review.push({question:qq.question,options:qq.options,correctAnswer:qq.correctAnswer,selected:sel,isCorrect:ok,explanation:qq.explanation,subject:qq.subject,topic:qq.topic,source:qq.source});
  });
  const attempt={id:uid(),examTitle:ex.title,submittedAt:Date.now(),status:'submitted',score,correct,incorrect,unattempted,totalQuestions:ex.questions.length,maxScore:ex.questions.length*4,analysis:{subjectStats:subjStats,topicStats},review};
  State.attempts.unshift(attempt);Storage.set(K.attempts,State.attempts);State.exam=null;
  toast(`Score: ${score}`,'success');navigate('/results?attempt='+attempt.id);
}

function ResultsPage(){
  const qs=(location.hash.split('?')[1]||'');const id=new URLSearchParams(qs).get('attempt');
  if(id){const a=State.attempts.find(x=>x.id===id);if(!a)return {shell:p=>shell(p,'<div class="empty">Not found. <a href="#/results">Back</a></div>')};
    return {shell:p=>shell(p,renderAttemptDetail(a))};}
  const html=`<h1>Results</h1>${State.attempts.length===0?'<div class="empty"><div class="empty-icon">📝</div>No attempts yet. <a href="#/mock">Take a mock</a>.</div>':State.attempts.map(a=>`<div class="result-card" onclick="navigate('/results?attempt=${a.id}')"><div class="result-score">${a.score}</div><div class="result-meta"><strong>${esc(a.examTitle)}</strong><span>${fmtDate(a.submittedAt)} • ${a.correct}/${a.totalQuestions}</span></div><span class="badge badge-type">View →</span></div>`).join('')}`;
  return {shell:p=>shell(p,html)};
}
function renderAttemptDetail(a){
  return `<a href="#/results" class="btn btn-ghost btn-sm" style="margin-bottom:.85rem">← Back</a><h2>${esc(a.examTitle)}</h2><div class="grid grid-4" style="margin-bottom:1rem"><div class="card"><div class="stat"><div class="stat-value">${a.score}</div><div class="stat-label">Score / ${a.maxScore}</div></div></div><div class="card"><div class="stat"><div class="stat-value" style="color:var(--ok)">${a.correct}</div><div class="stat-label">Correct</div></div></div><div class="card"><div class="stat"><div class="stat-value" style="color:var(--bad)">${a.incorrect}</div><div class="stat-label">Incorrect</div></div></div><div class="card"><div class="stat"><div class="stat-value">${a.unattempted}</div><div class="stat-label">Unattempted</div></div></div></div><div class="card" style="margin-bottom:1rem"><div class="card-title">By Subject</div>${Object.entries(a.analysis.subjectStats||{}).map(([s,v])=>{const p=pct(v.correct,v.total);return `<div style="margin-bottom:.6rem"><div class="row" style="justify-content:space-between"><strong>${esc(s)}</strong><span style="font-size:.76rem;color:var(--muted)">${v.correct}/${v.total} · ${p}%</span></div><div class="bar"><div class="bar-fill" style="width:${p}%"></div></div></div>`;}).join('')}</div><h3>Review</h3><div class="stack">${(a.review||[]).map((r,i)=>`<div class="qcard"><div class="qcard-head"><span class="badge ${r.isCorrect?'badge-curated':'badge-ai'}">${r.isCorrect?'✓ Correct':(r.selected===null?'—':'✗ Wrong')}</span><span class="badge badge-type">${esc(r.subject)}</span>${r.source==='pyq'?'<span class="badge badge-pyq">PYQ 2026</span>':''}</div><div class="qcard-text">Q${i+1}. ${esc(r.question)}</div><div class="qoptions">${r.options.map((o,j)=>{const c=['qoption'];if(j===r.correctAnswer)c.push('correct');else if(j===r.selected)c.push('wrong');return `<div class="${c.join(' ')}"><span class="qoption-key">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></div>`;}).join('')}</div><div class="explanation">${esc(r.explanation)}</div></div>`).join('')}</div>`;
}

function SettingsPage(){
  const html=`<h1>Settings</h1><div class="card" style="margin-bottom:.85rem"><div class="card-title">👤 Profile</div><div class="field"><label>Name</label><input class="input" id="s-name" value="${esc(State.profile.name)}" oninput="State.profile.name=this.value;Storage.set(K.profile,State.profile)" style="max-width:300px"></div></div><div class="card" style="margin-bottom:.85rem"><div class="card-title">🎨 Theme</div><button class="btn btn-ghost" onclick="toggleTheme()">${State.theme==='dark'?'☀️ Light':'🌙 Dark'}</button></div><div class="card" style="margin-bottom:.85rem"><div class="card-title">🤖 AI Question Generation</div><div class="callout callout-warn" style="margin-bottom:.85rem"><strong>⚠️</strong> DeepSeek key stored in localStorage. Anyone with browser access can read it. Use a disposable key.</div><div class="field" style="margin-bottom:.65rem"><label>DeepSeek API Key</label><input class="input" type="password" id="s-key" value="${esc(State.apiKey)}" oninput="State.apiKey=this.value;Storage.set(K.apiKey,State.apiKey)" placeholder="sk-..."></div><div class="grid grid-3" style="margin-bottom:.65rem"><div class="field"><label>Subject</label><select class="select" id="g-subj" onchange="updateGenTopics()">${SYLLABUS.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Topic</label><select class="select" id="g-topic"></select></div><div class="field"><label>Count</label><select class="select" id="g-count"><option>3</option><option selected>5</option><option>10</option></select></div></div><button class="btn btn-primary" id="g-btn" onclick="runGen()">🤖 Generate</button><div id="g-status" style="margin-top:.65rem"></div></div><div class="card"><div class="card-title">💾 Data</div><div class="row"><button class="btn btn-ghost btn-sm" onclick="exportData()">📤 Export</button><button class="btn btn-ghost btn-sm" onclick="importData()">📥 Import</button><button class="btn btn-danger btn-sm" onclick="clearAttempts()">🗑️ Clear Attempts</button><button class="btn btn-danger btn-sm" onclick="clearGenerated()">🗑️ Clear AI Questions</button></div></div><div class="card" style="margin-top:.85rem"><div class="card-title">ℹ️ About</div><p style="font-size:.82rem">Independent NEET UG practice platform. Not affiliated with NTA. Includes ${PYQ_QUESTIONS.length} NEET 2026 May PYQs and ${SYSTEMATIC.length} systematic questions.</p></div>`;
  return {shell:p=>shell(p,html),mounted:()=>updateGenTopics()};
}
function updateGenTopics(){
  const s=document.getElementById('g-subj'),t=document.getElementById('g-topic');if(!s||!t)return;
  const data=SYLLABUS.find(x=>x.name===s.value);const topics=(data?.units||[]).flatMap(u=>u.topics);
  t.innerHTML=topics.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
}
async function runGen(){
  const key=State.apiKey.trim();const sub=document.getElementById('g-subj').value;const topic=document.getElementById('g-topic').value;const count=+document.getElementById('g-count').value;
  const st=document.getElementById('g-status'),btn=document.getElementById('g-btn');
  if(!key){toast('Enter key first','error');return;}
  btn.disabled=true;st.innerHTML='<div class="callout callout-info">⏳ Calling DeepSeek...</div>';
  try{
    const res=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-chat',response_format:{type:'json_object'},messages:[{role:'system',content:'NEET UG item writer. Return JSON: {"questions":[{"questionType":"conceptual","difficulty":"medium","question":"...","options":["A","B","C","D"],"correctAnswer":0,"explanation":"..."}]}'},{role:'user',content:`Generate ${count} NEET MCQs on "${topic}" in ${sub}.`}]})});
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();const content=data.choices?.[0]?.message?.content;if(!content)throw new Error('Empty');
    let parsed;try{parsed=JSON.parse(content);}catch{parsed=JSON.parse(content.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim());}
    const arr=Array.isArray(parsed.questions)?parsed.questions:[];
    const sdata=SYLLABUS.find(x=>x.name===sub);const unit=sdata?.units.find(u=>u.topics.includes(topic))?.title||'General';
    let added=0;
    for(const r of arr){
      if(!r.question||!Array.isArray(r.options)||r.options.length!==4)continue;
      const ca=+r.correctAnswer;if(!Number.isInteger(ca)||ca<0||ca>3)continue;
      if(!r.explanation||String(r.explanation).length<20)continue;
      State.generated.push({id:'ai-'+uid(),subject:sub,unit,topic,type:'conceptual',difficulty:['easy','medium','hard'].includes(r.difficulty)?r.difficulty:'medium',question:String(r.question).slice(0,2000),options:r.options.map(o=>String(o).slice(0,500)),correctAnswer:ca,explanation:String(r.explanation).slice(0,2000),source:'ai'});
      added++;
    }
    Storage.set(K.generated,State.generated);
    st.innerHTML=`<div class="callout callout-info">✓ Added ${added} questions.</div>`;
    toast(`Generated ${added}`,'success');
  }catch(e){st.innerHTML=`<div class="callout callout-error">✗ ${esc(e.message)}</div>`;}
  finally{btn.disabled=false;}
}
function exportData(){const d={profile:State.profile,attempts:State.attempts,generated:State.generated};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mednova-${Date.now()}.json`;a.click();toast('Exported','success');}
function importData(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.profile){State.profile=d.profile;Storage.set(K.profile,d.profile);}if(Array.isArray(d.attempts)){State.attempts=d.attempts;Storage.set(K.attempts,d.attempts);}if(Array.isArray(d.generated)){State.generated=d.generated;Storage.set(K.generated,d.generated);}toast('Imported','success');render();}catch(e){toast('Failed','error');}};i.click();}
async function clearAttempts(){if(!await confirmDialog('Delete ALL attempts?'))return;State.attempts=[];Storage.set(K.attempts,[]);toast('Cleared','success');render();}
async function clearGenerated(){if(!await confirmDialog('Delete ALL AI questions?'))return;State.generated=[];Storage.set(K.generated,[]);toast('Cleared','success');render();}

document.documentElement.dataset.theme=State.theme;
window.addEventListener('hashchange',render);
if(document.readyState!=='loading')render();else document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
